<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Happy Birthday Lily ❤️</title>

<meta name="theme-color" content="#8FEFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

:root{
    --blue:#7edcff;
    --aqua:#9ff3f5;
    --white:#ffffff;
    --glass:rgba(255,255,255,.35);
    --border:rgba(255,255,255,.6);
    --text:#19445d;
    --shadow:0 20px 45px rgba(0,140,200,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    overflow-x:hidden;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;

    color:var(--text);

    background:
    linear-gradient(
        180deg,
        #dff9ff,
        #bdefff,
        #eaffff
    );

}

/* Background */

#ocean{

    position:fixed;
    inset:0;
    z-index:-2;
    overflow:hidden;

}

.wave{

    position:absolute;

    left:50%;
    bottom:-500px;

    width:1000px;
    height:1000px;

    border-radius:50%;

    border:2px solid rgba(255,255,255,.25);

    transform:translateX(-50%) scale(.2);

    animation:wave 10s infinite;

}

.wave:nth-child(2){

animation-delay:3s;

}

.wave:nth-child(3){

animation-delay:6s;

}

@keyframes wave{

from{

transform:
translateX(-50%)
scale(.2);

opacity:.6;

}

to{

transform:
translateX(-50%)
scale(1.4);

opacity:0;

}

}

.bubble{

position:absolute;

bottom:-60px;

border-radius:50%;

background:rgba(255,255,255,.35);

border:1px solid rgba(255,255,255,.55);

animation:rise linear infinite;

}

@keyframes rise{

from{

transform:translateY(0);

opacity:0;

}

20%{

opacity:.7;

}

to{

transform:
translateY(-120vh)
translateX(35px);

opacity:0;

}

}

.screen{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

padding:30px;

}

.hide{

display:none;

}

.card{

width:100%;
max-width:420px;

padding:35px;

border-radius:30px;

background:var(--glass);

backdrop-filter:blur(20px);

border:1px solid var(--border);

box-shadow:var(--shadow);

text-align:center;

animation:fade .8s ease;

}

@keyframes fade{

from{

opacity:0;

transform:
translateY(30px);

}

to{

opacity:1;

transform:none;

}

}

h1{

font-size:42px;

margin-bottom:18px;

}

h2{

font-size:30px;

margin-bottom:20px;

}

p{

font-size:18px;

line-height:1.7;

}

.subtitle{

margin-bottom:30px;

opacity:.75;

}

button{

width:100%;

margin-top:30px;

padding:18px;

border:none;

border-radius:18px;

font-size:18px;

font-weight:700;

color:white;

background:
linear-gradient(
135deg,
#67d8ff,
#7cefe8
);

box-shadow:0 15px 30px rgba(0,180,255,.25);

}

.photo{

width:100%;

border-radius:22px;

margin:25px 0;

box-shadow:0 12px 30px rgba(0,0,0,.15);

}

.checklist{

margin-top:20px;

padding:20px;

border-radius:20px;

background:rgba(255,255,255,.3);

text-align:left;

line-height:2;

}

#countdown{

margin:25px 0;

font-size:22px;

font-weight:bold;

}

.ticket{

margin-top:30px;

padding:25px;

border-radius:25px;

background:white;

border:3px dashed #69dfff;

}

.confetti{

position:fixed;

top:-20px;

width:10px;

height:16px;

animation:fall 3s linear forwards;

z-index:999;

}

@keyframes fall{

to{

transform:
translateY(110vh)
rotate(720deg);

opacity:0;

}

}

.heart{

position:fixed;

bottom:-30px;

font-size:24px;

animation:heart 4s linear forwards;

z-index:999;

}

@keyframes heart{

to{

transform:
translateY(-110vh)
translateX(40px)
scale(1.4);

opacity:0;

}

}

/* ===== Part 2 CSS goes here ===== */

</style>

</head>

<body>

<div id="ocean">

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

</div>

<!-- HOME -->

<section class="screen" id="home">

<div class="card">

<h1>

Happy Birthday Lily ❤️

</h1>

<p class="subtitle">

I made a little surprise just for you...

</p>

<button onclick="openGift()">

Tap Here ❤️

</button>

</div>

</section>

<!-- SURPRISE -->

<section class="screen hide" id="gift">

<div class="card">

<h2>

Surprise! 🎉

</h2>

<p>

I asked you to keep
<strong>August 6th</strong>
free for a reason...

<br><br>

We're spending the day together at

<strong>Fondy Aqua Park!</strong>

🌊❤️

</p>

<!-- PHOTO 1 -->

<img src="D294BA6C-0DE1-42D3-83FD-0F461E56F993.png" class="photo">

<div class="checklist">

✅ Swimsuit

<br>

✅ Towel

<br>

✅ Sunscreen

<br>

✅ Biggest Smile ❤️

</div>

<!-- PHOTO 2 -->

<img src="D693BC53-4583-42DE-AFFE-A97E83A23034.png" class="photo">

<div id="messageArea"></div>

<button id="loveButton">

I Can't Wait ❤️

</button>

</div>

</section>

<script>

// ===============================
// Floating Bubbles
// ===============================

const ocean = document.getElementById("ocean");

for(let i=0;i<25;i++){

    const bubble=document.createElement("div");

    bubble.className="bubble";

    const size=Math.random()*40+15;

    bubble.style.width=size+"px";
    bubble.style.height=size+"px";

    bubble.style.left=Math.random()*100+"vw";

    bubble.style.animationDuration=(8+Math.random()*8)+"s";

    bubble.style.animationDelay=(-Math.random()*10)+"s";

    ocean.appendChild(bubble);

}

// ===============================
// Open Gift
// ===============================

function openGift(){

    document.getElementById("home").classList.add("hide");

    document.getElementById("gift").classList.remove("hide");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    confetti();

}

// ===============================
// Confetti
// ===============================

function confetti(){

    const colors=[
        "#7edcff",
        "#9ff3f5",
        "#ffffff",
        "#ffb3d9"
    ];

    for(let i=0;i<120;i++){

        const piece=document.createElement("div");

        piece.className="confetti";

        piece.style.left=Math.random()*100+"vw";

        piece.style.background=
        colors[Math.floor(Math.random()*colors.length)];

        piece.style.animationDuration=
        (2+Math.random()*2)+"s";

        document.body.appendChild(piece);

        setTimeout(()=>{

            piece.remove();

        },4000);

    }

}

// ===============================
// Hearts
// ===============================

function hearts(){

    for(let i=0;i<35;i++){

        const heart=document.createElement("div");

        heart.className="heart";

        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"vw";

        heart.style.fontSize=
        (18+Math.random()*18)+"px";

        heart.style.animationDelay=
        Math.random()*1.5+"s";

        document.body.appendChild(heart);

        setTimeout(()=>{

            heart.remove();

        },5000);

    }

}

// ===============================
// Final Button
// ===============================

document.getElementById("loveButton").addEventListener("click",()=>{

    confetti();

    hearts();

    document.getElementById("loveButton").style.display="none";

    document.getElementById("messageArea").innerHTML=`

    <div class="ticket">

        <h2>❤️ Happy Birthday Lily ❤️</h2>

        <p>

        I hope this little surprise made you smile.

        <br><br>

        I seriously can't wait to spend the day with you at
        <strong>Fondy Aqua Park</strong>.

        <br><br>

        Thank you for being the amazing person you are.

        <br><br>

        I love you so much, and I'm excited to make even more memories together.

        ❤️

        <br><br>

        Love,

        <strong>Gavin</strong>

        </p>

    </div>

    `;

});

</script>

</body>
</html>
